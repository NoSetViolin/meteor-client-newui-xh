modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/cabaletta/baritone/issues"

[[mods]]
modId = "baritone"
version = "${version}"
displayName = "Baritone"
displayURL = "https://github.com/cabaletta/baritone"
authors = "leijurv, Brady"
credits = "Hat Gamers"
description = '''
A Minecraft pathfinder bot.
'''
# 纯客户端 mod：服务端缺该 mod 时不要把客户端踢掉
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "mixins.baritone-neoforge.json"

[[dependencies.baritone]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.baritone]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"
